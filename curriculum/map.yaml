# Foundry Curriculum Map
# This is a living document. Modules are added as new topics are explored.
# Structure: category > module > metadata
# Prerequisites reference other module keys.
# Tiers indicate rough progression order (1 = start here, 5 = advanced).

modules:
  # ===========================================================================
  # FUNDAMENTALS
  # ===========================================================================

  fundamentals:
    variables-and-types:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: []
      description: >
        Primitive types, composite types, type inference, type systems
        (static vs dynamic, structural vs nominal), zero values and defaults.

    control-flow:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types]
      description: >
        Conditionals, loops, switch/match, early returns, guard clauses.
        Language-specific: Go's if-err pattern, Rust's match exhaustiveness,
        Python's for-else.

    functions-and-closures:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [control-flow]
      description: >
        Function signatures, multiple returns, closures and captures,
        higher-order functions, variadic arguments. Go's defer,
        Rust's Fn/FnMut/FnOnce, C#'s delegates and lambdas.

    structs-methods-and-enums:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types]
      description: >
        Defining composite data types and attaching behavior. Go: structs,
        methods, pointer vs value receivers, embedding/composition. Rust:
        structs, enums (algebraic data types), impl blocks, associated
        functions, Option/Result as enums. Pattern matching on enums.
        When to use composition over inheritance.

    collections:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types]
      description: >
        Core data structures for daily use. Arrays, slices/vectors,
        maps/hashmaps, sets. Internal mechanics (capacity, growth,
        hashing), common operations, iteration patterns. Go: slice
        internals (len vs cap, append reallocation, backing arrays),
        nil vs empty slice, map iteration order. Rust: Vec, HashMap,
        HashSet, BTreeMap, slice borrowing rules, entry API.

    error-handling:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures]
      variants:
        - sentinel-errors
        - custom-error-types
        - result-types
        - discriminated-unions
        - exceptions
        - panic-recover
        - error-wrapping
        - multi-error-aggregation
      description: >
        How each language models failure. Go's explicit errors, Rust's
        Result<T,E> and the ? operator, TypeScript's discriminated unions,
        Java's checked/unchecked exceptions, Python's exception hierarchy.

    interfaces-and-traits:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures, structs-methods-and-enums]
      description: >
        Contracts and polymorphism. Go's implicit interfaces, Rust's traits
        and trait bounds, TypeScript's structural typing and interfaces,
        C#'s interfaces and abstract classes, Python's ABCs and protocols.

    generics:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Parameterized types and functions. Go's type parameters and
        constraints, Rust's generics with trait bounds, TypeScript's generics
        with conditional/mapped types, C#'s reified generics,
        Python's typing.Generic.

    concurrency:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [error-handling, interfaces-and-traits]
      variants:
        - goroutines-and-channels
        - async-await
        - tokio-runtime
        - threading-and-gil
        - virtual-threads
        - select-and-multiplexing
        - mutexes-and-shared-state
        - csp-vs-actor-model
      description: >
        Concurrency primitives and models. Go's CSP with goroutines/channels,
        Rust's ownership-based concurrency safety, TypeScript's event loop
        and promises, Java's virtual threads and CompletableFuture,
        Python's asyncio and the GIL.

    memory-and-ownership:
      tier: 3
      languages: [go, rust, scala, csharp, zig]
      prereqs: [pointers-and-smart-pointers, functions-and-closures]
      description: >
        How languages manage memory. Rust's ownership/borrowing/lifetimes,
        Go's garbage collector and escape analysis, C#'s CLR and GC generations.
        Stack vs heap, value vs reference semantics.

    serialization:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Encoding and decoding data. JSON, protobuf, MessagePack.
        Go's struct tags and encoding/json, Rust's serde, TypeScript's
        Zod and runtime validation, C#'s System.Text.Json, Python's pydantic.
        Schema validation and evolution.

    strings-and-text:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [collections]
      description: >
        String internals and encoding (UTF-8, UTF-16). Manipulation,
        formatting, parsing, and regular expressions. Go: string vs
        []byte vs []rune, strings/bytes packages, fmt verbs.
        Rust: String vs &str, OsString, formatting macros, string
        slicing safety (panics on non-char boundaries). Text templates
        and interpolation patterns.

    io-and-files:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [error-handling]
      description: >
        Reading and writing data. Stream abstractions, buffered I/O,
        file operations, stdin/stdout, environment variables. Go:
        io.Reader/io.Writer composition, bufio, os package, embed.
        Rust: Read/Write traits, BufReader/BufWriter, std::fs,
        Path/PathBuf. Resource cleanup (defer, Drop/RAII).

    pointers-and-smart-pointers:
      tier: 2
      languages: [go, rust, zig, csharp]
      prereqs: [structs-methods-and-enums]
      description: >
        Indirection and heap allocation. Go: pointer semantics (*T, &x),
        nil pointers, when to use pointers, pointer vs value receivers.
        Rust: references (&T, &mut T), Box<T>, Rc<T>, Arc<T>,
        RefCell<T>, Cell<T>, Cow<T>. Interior mutability pattern.
        When to reach for each smart pointer type.

    testing-fundamentals:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures, error-handling]
      description: >
        Testing philosophy and mechanics. Unit tests, table-driven tests,
        test doubles (mocks, stubs, fakes), assertion patterns, test
        organization. Go's testing package, Rust's built-in tests,
        Jest/Vitest, xUnit/NUnit, pytest.

    modules-and-packages:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types]
      description: >
        Code organization. Go modules and packages, Rust's crate/module
        system, TypeScript's module resolution (ESM/CJS), C#'s namespaces
        and assemblies, Python's import system. Visibility and encapsulation.

  # ===========================================================================
  # PATTERNS
  # ===========================================================================

  patterns:
    strategy:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Swap behavior at runtime via interchangeable implementations behind
        a common interface. Foundation for plugin architectures, configurable
        pipelines, and policy-based design.

    observer:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Notify dependents of state changes without tight coupling.
        Foundation for event systems, reactive UIs, and pub/sub.

    factory:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Controlled construction of objects/values. Factory functions,
        abstract factories. When construction logic is complex or
        the concrete type should be hidden from callers.

    builder:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits]
      description: >
        Step-by-step construction of complex objects. Fluent APIs,
        optional configuration, validation at build time. Go's
        functional options pattern as an alternative.

    decorator-middleware:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures, interfaces-and-traits]
      description: >
        Compose behavior by wrapping. HTTP middleware chains, logging
        decorators, retry wrappers. Composition over inheritance in
        practice.

    repository:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits, error-handling]
      description: >
        Abstract data access behind a clean interface. Decouple business
        logic from storage. Enable testing with in-memory implementations.
        Query patterns and specification objects.

    dependency-injection:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits, factory]
      description: >
        Invert control of dependencies. Constructor injection, functional
        injection, wire/dig in Go, tsyringe in TS, C#'s built-in DI.
        When to use a container vs manual wiring.

    iterator-generator:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures]
      description: >
        Lazy evaluation and streaming. Go's iter package and channel-based
        iterators, TypeScript's generators and async iterators, Rust's
        Iterator trait, Python's generators and itertools, C#'s LINQ and IEnumerable.

    pub-sub:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [observer, concurrency]
      description: >
        Decouple producers from consumers. In-process event buses,
        topic-based routing, message filtering. Foundation for
        event-driven architecture.

    circuit-breaker:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [error-handling, concurrency]
      description: >
        Prevent cascading failures. States (closed, open, half-open),
        failure thresholds, timeout strategies, fallback behavior.
        Retry with backoff. Bulkhead pattern.

    chain-of-responsibility:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [interfaces-and-traits, decorator-middleware]
      description: >
        Pass requests through a chain of handlers. Validation pipelines,
        approval workflows, request processing. Relationship to
        middleware pattern.

  # ===========================================================================
  # ARCHITECTURE
  # ===========================================================================

  architecture:
    layered:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [repository, decorator-middleware, dependency-injection]
      description: >
        Traditional layered architecture. Presentation, business logic,
        data access. Dependency direction, layer boundaries, when it
        works and when it breaks down.

    hexagonal:
      tier: 5
      languages: [go, typescript, rust, scala, csharp]
      prereqs: [layered, strategy, repository, dependency-injection]
      description: >
        Ports and adapters. Core domain isolated from infrastructure.
        Driving and driven ports. Adapter implementations. Testing
        the core without infrastructure.

    cqrs:
      tier: 5
      languages: [go, typescript, scala, csharp]
      prereqs: [hexagonal, observer, pub-sub]
      description: >
        Separate read and write models. Command handlers, query handlers,
        read model projections. When to use full vs lightweight CQRS.
        Relationship to event sourcing.

    event-driven:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [pub-sub, observer]
      description: >
        Architecture built around events. Event producers, consumers,
        event buses. Choreography vs orchestration. Event schemas
        and evolution. Eventual consistency.

    event-sourcing:
      tier: 5
      languages: [go, typescript, scala, csharp]
      prereqs: [cqrs, event-driven]
      description: >
        Store state as a sequence of events. Event stores, projections,
        snapshots, replaying. Advantages and operational complexity.

    microservices:
      tier: 5
      languages: [go, typescript, scala, csharp]
      prereqs: [hexagonal, event-driven, circuit-breaker]
      description: >
        Service decomposition. Bounded contexts, API contracts,
        inter-service communication (sync vs async), service discovery,
        data ownership. Saga patterns for distributed transactions.

    api-gateway-bff:
      tier: 4
      languages: [go, typescript, csharp]
      prereqs: [layered, decorator-middleware]
      description: >
        Edge routing and aggregation. API gateway responsibilities,
        BFF pattern for client-specific APIs, rate limiting at the edge,
        authentication/authorization middleware.

    clean-architecture:
      tier: 5
      languages: [go, typescript, scala, csharp]
      prereqs: [hexagonal, dependency-injection]
      description: >
        Uncle Bob's concentric layers. Entities, use cases, interface
        adapters, frameworks. Dependency rule. Comparison with hexagonal.

  # ===========================================================================
  # DATA STRUCTURES & ALGORITHMS
  # ===========================================================================

  dsa:
    arrays-and-hashing:
      tier: 1
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types]
      description: >
        Array manipulation, hash maps, sets. Two pointers, sliding window,
        frequency counting. Time/space complexity analysis.

    linked-lists:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [variables-and-types, control-flow]
      description: >
        Singly and doubly linked lists. Pointer manipulation, fast/slow
        pointers, reversal, cycle detection. Rust's ownership challenges
        with linked lists.

    stacks-and-queues:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [arrays-and-hashing]
      description: >
        LIFO and FIFO structures. Monotonic stacks, priority queues,
        deques. Applications in parsing, BFS, task scheduling.

    trees:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [stacks-and-queues]
      description: >
        Binary trees, BSTs, balanced trees. Traversal (inorder, preorder,
        postorder, level-order). Recursion patterns. Tries for string
        problems.

    graphs:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [trees, stacks-and-queues]
      description: >
        Representations (adjacency list/matrix). BFS, DFS, topological
        sort, shortest path (Dijkstra, Bellman-Ford). Connected components,
        cycle detection.

    sorting:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [arrays-and-hashing]
      description: >
        Comparison sorts (merge, quick, heap). Non-comparison sorts
        (counting, radix). Stability, in-place vs extra space. Language
        standard library sort implementations and guarantees.

    searching:
      tier: 2
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [sorting]
      description: >
        Binary search and its variations. Search in rotated arrays,
        search space reduction. Bisect patterns.

    dynamic-programming:
      tier: 4
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [arrays-and-hashing, trees]
      description: >
        Overlapping subproblems and optimal substructure. Memoization
        vs tabulation. 1D and 2D DP. Common patterns: knapsack, LCS,
        interval DP.

    recursion-and-backtracking:
      tier: 3
      languages: [go, typescript, rust, python, scala, csharp, zig, haskell]
      prereqs: [functions-and-closures, trees]
      description: >
        Recursive thinking, base cases, recursive decomposition.
        Backtracking for constraint satisfaction, permutations,
        combinations, sudoku, n-queens.

  # ===========================================================================
  # SYSTEM DESIGN
  # ===========================================================================

  system-design:
    resilience-patterns:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [circuit-breaker, error-handling, concurrency]
      description: >
        Building reliable systems. Circuit breakers, retries with
        exponential backoff, bulkheads, timeouts, graceful degradation,
        health checks.

    caching:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [repository]
      description: >
        Cache strategies (aside, through, behind). TTL, eviction policies
        (LRU, LFU). Cache invalidation. Redis patterns. Local vs
        distributed caching.

    load-balancing:
      tier: 4
      languages: [go, typescript]
      prereqs: [concurrency]
      description: >
        Distribution strategies (round-robin, least connections,
        consistent hashing). L4 vs L7 balancing. Health checking.
        Connection pooling.

    message-queues:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [pub-sub, concurrency]
      description: >
        Queue semantics (at-most-once, at-least-once, exactly-once).
        Kafka, RabbitMQ, NATS conceptual models. Consumer groups,
        partitioning, dead letter queues, backpressure.

    database-patterns:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [repository]
      description: >
        SQL fundamentals: joins, indexing, query plans, N+1 detection.
        Connection pooling, transactions and isolation levels. Migration
        strategies. Read replicas. Sharding concepts.

    observability:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [decorator-middleware, error-handling]
      description: >
        Structured logging, metrics, distributed tracing. OpenTelemetry.
        Log levels and when to use them. Correlation IDs. Alerting
        strategies. Instrumenting by default.

    security-fundamentals:
      tier: 4
      languages: [go, typescript, scala, csharp]
      prereqs: [decorator-middleware, error-handling]
      description: >
        Authentication vs authorization. JWT, OAuth2/OIDC flows.
        Input validation and sanitization. CORS. Rate limiting.
        Secret management. OWASP top 10 awareness.
